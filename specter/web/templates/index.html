<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specter — Network Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        specter: { 900: '#0a0a0f', 800: '#12121a', 700: '#1a1a2e', 600: '#252540' },
                        neon: { red: '#ff3b3b', green: '#00ff88', blue: '#00bfff', yellow: '#ffd700', purple: '#b44dff', orange: '#ff8c00' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glow-red { box-shadow: 0 0 20px rgba(255, 59, 59, 0.3); }
        .glow-green { box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }
        .glow-blue { box-shadow: 0 0 20px rgba(0, 191, 255, 0.3); }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .device-card:hover { transform: translateY(-2px); transition: all 0.2s; }
        .log-entry { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-20px); } }
        .toast { animation: toastIn 0.3s ease-out; }
        .toast-exit { animation: toastOut 0.3s ease-out forwards; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #12121a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        /* Topology graph */
        .topo-node { cursor: pointer; transition: all 0.2s; }
        .topo-node:hover { filter: brightness(1.3); }
        .topo-line { stroke: #333; stroke-width: 1; }
        .topo-line-active { stroke: #ff3b3b; stroke-width: 2; animation: pulse 1s infinite; }
        /* Mobile responsive */
        @media (max-width: 768px) {
            .main-layout { flex-direction: column !important; }
            .left-panel, .right-panel { width: 100% !important; border-right: none !important; }
            .left-panel { height: 60vh; }
            .right-panel { height: 40vh; }
        }
    </style>
</head>
<body class="bg-specter-900 text-gray-200 min-h-screen">
    <!-- Toast container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[100] space-y-2 max-w-sm"></div>

    <!-- Header -->
    <header class="border-b border-gray-800 px-4 md:px-6 py-3 flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-neon-red rounded-lg flex items-center justify-center glow-red">
                <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                    <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-white">SPECTER</h1>
            <span class="text-xs text-gray-500 mono">v0.2.0</span>
        </div>
        <div class="flex items-center gap-3 flex-wrap">
            <div id="monitor-badge" class="hidden px-3 py-1 bg-green-900/50 border border-green-700 rounded-full cursor-pointer" onclick="toggleMonitor()">
                <span class="text-xs text-neon-green mono"><span class="inline-block w-2 h-2 rounded-full bg-neon-green pulse mr-1"></span>MONITORING</span>
            </div>
            <div id="status-indicator" class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-neon-green pulse"></div>
                <span class="text-xs text-gray-400">Connected</span>
            </div>
            <div id="attack-counter" class="hidden px-3 py-1 bg-red-900/50 border border-red-700 rounded-full">
                <span class="text-xs text-neon-red mono font-bold"><span id="attack-count">0</span> ACTIVE</span>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout flex h-[calc(100vh-57px)]">
        <!-- Left Panel: Devices -->
        <div class="left-panel w-2/3 border-r border-gray-800 flex flex-col">
            <!-- Toolbar -->
            <div class="px-4 md:px-6 py-3 border-b border-gray-800 flex items-center gap-2 flex-wrap">
                <button onclick="runScan(false)" class="px-3 py-1.5 bg-neon-blue/10 border border-neon-blue/30 text-neon-blue rounded-lg hover:bg-neon-blue/20 transition text-xs font-medium">
                    Scan
                </button>
                <button onclick="runScan(true)" class="px-3 py-1.5 bg-neon-purple/10 border border-neon-purple/30 text-neon-purple rounded-lg hover:bg-neon-purple/20 transition text-xs font-medium">
                    Deep Scan
                </button>
                <button onclick="fullScan()" class="px-3 py-1.5 bg-neon-green/10 border border-neon-green/30 text-neon-green rounded-lg hover:bg-neon-green/20 transition text-xs font-medium">
                    Full Recon
                </button>
                <button onclick="nukeNetwork('all')" class="px-3 py-1.5 bg-neon-red/10 border border-neon-red/30 text-neon-red rounded-lg hover:bg-neon-red/20 transition text-xs font-medium">
                    NUKE
                </button>
                <button onclick="nukeNetwork('gateway')" class="px-3 py-1.5 bg-neon-yellow/10 border border-neon-yellow/30 text-neon-yellow rounded-lg hover:bg-neon-yellow/20 transition text-xs font-medium">
                    Kill GW
                </button>
                <button onclick="toggleMonitor()" id="monitor-btn" class="px-3 py-1.5 bg-green-900/10 border border-green-700/30 text-green-400 rounded-lg hover:bg-green-900/20 transition text-xs font-medium">
                    Monitor
                </button>
                <button onclick="exportReport()" class="px-3 py-1.5 bg-gray-700/30 border border-gray-600 text-gray-300 rounded-lg hover:bg-gray-600/30 transition text-xs font-medium">
                    Report
                </button>
                <button onclick="stopAllAttacks()" id="stop-all-btn" class="hidden px-3 py-1.5 bg-gray-700 border border-gray-600 text-white rounded-lg hover:bg-gray-600 transition text-xs font-medium">
                    STOP ALL
                </button>
                <div id="scan-status" class="ml-auto text-xs text-gray-500"></div>
            </div>

            <!-- View Tabs -->
            <div class="flex border-b border-gray-800 px-4">
                <button onclick="switchView('grid')" id="view-grid" class="px-3 py-2 text-xs font-medium text-neon-blue border-b-2 border-neon-blue">Devices</button>
                <button onclick="switchView('topology')" id="view-topology" class="px-3 py-2 text-xs font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-300">Topology</button>
                <button onclick="switchView('vulns')" id="view-vulns" class="px-3 py-2 text-xs font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-300">Vulnerabilities</button>
            </div>

            <!-- Device Grid View -->
            <div id="view-grid-panel" class="flex-1 overflow-y-auto p-4 md:p-6">
                <div id="devices-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4">
                    <div id="empty-state" class="col-span-full flex flex-col items-center justify-center py-20 text-gray-500">
                        <svg class="w-16 h-16 mb-4 opacity-30" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5.05 3.636a1 1 0 010 1.414 7 7 0 000 9.9 1 1 0 11-1.414 1.414 9 9 0 010-12.728 1 1 0 011.414 0zm9.9 0a1 1 0 011.414 0 9 9 0 010 12.728 1 1 0 11-1.414-1.414 7 7 0 000-9.9 1 1 0 010-1.414zM7.879 6.464a1 1 0 010 1.414 3 3 0 000 4.243 1 1 0 11-1.415 1.414 5 5 0 010-7.07 1 1 0 011.415 0zm4.242 0a1 1 0 011.415 0 5 5 0 010 7.072 1 1 0 01-1.415-1.415 3 3 0 000-4.242 1 1 0 010-1.415zM10 9a1 1 0 100 2 1 1 0 000-2z"/>
                        </svg>
                        <p class="text-lg">No devices discovered</p>
                        <p class="text-sm mt-1">Click "Scan" to discover devices</p>
                    </div>
                </div>
            </div>

            <!-- Topology View -->
            <div id="view-topology-panel" class="flex-1 overflow-hidden hidden">
                <svg id="topology-svg" class="w-full h-full"></svg>
            </div>

            <!-- Vulnerabilities View -->
            <div id="view-vulns-panel" class="flex-1 overflow-y-auto p-4 md:p-6 hidden">
                <div id="vulns-content" class="space-y-3">
                    <p class="text-gray-500">Run a Deep Scan or Full Recon to detect vulnerabilities.</p>
                </div>
            </div>
        </div>

        <!-- Right Panel: Logs & Details -->
        <div class="right-panel w-1/3 flex flex-col">
            <div class="flex border-b border-gray-800">
                <button onclick="switchTab('logs')" id="tab-logs" class="flex-1 px-4 py-3 text-sm font-medium text-neon-green border-b-2 border-neon-green">
                    Live Feed
                </button>
                <button onclick="switchTab('details')" id="tab-details" class="flex-1 px-4 py-3 text-sm font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-300">
                    Details
                </button>
            </div>

            <!-- Logs Panel -->
            <div id="panel-logs" class="flex-1 overflow-y-auto p-4 mono text-xs">
                <div id="log-entries" class="space-y-1">
                    <div class="text-gray-600">[system] Specter v0.2.0 ready. Scan to begin.</div>
                </div>
            </div>

            <!-- Details Panel -->
            <div id="panel-details" class="flex-1 overflow-y-auto p-4 hidden">
                <div id="device-details" class="text-gray-500 text-sm">
                    Select a device to view details.
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50" onclick="closeModal(event)">
        <div class="bg-specter-800 border border-gray-700 rounded-xl w-[90vw] max-w-[600px] max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div id="modal-content" class="p-6"></div>
        </div>
    </div>

    <script>
        // State
        let devices = [];
        let attacks = {};
        let selectedDevice = null;
        let ws = null;
        let monitoring = false;
        let vulnerabilities = {};
        let osResults = {};

        // ========== Toast System ==========
        function showToast(message, type = 'info', duration = 4000) {
            const container = document.getElementById('toast-container');
            const colors = {
                info: 'bg-blue-900/90 border-blue-700 text-blue-200',
                success: 'bg-green-900/90 border-green-700 text-green-200',
                error: 'bg-red-900/90 border-red-700 text-red-200',
                warning: 'bg-yellow-900/90 border-yellow-700 text-yellow-200',
                attack: 'bg-red-900/90 border-red-500 text-red-100',
            };
            const el = document.createElement('div');
            el.className = `toast px-4 py-3 rounded-lg border text-sm ${colors[type] || colors.info}`;
            el.textContent = message;
            container.appendChild(el);
            setTimeout(() => {
                el.classList.add('toast-exit');
                setTimeout(() => el.remove(), 300);
            }, duration);
        }

        // ========== WebSocket ==========
        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            ws.onopen = () => {
                document.getElementById('status-indicator').innerHTML = `
                    <div class="w-2 h-2 rounded-full bg-neon-green pulse"></div>
                    <span class="text-xs text-gray-400">Connected</span>`;
            };
            ws.onmessage = (event) => handleWSEvent(JSON.parse(event.data));
            ws.onclose = () => {
                document.getElementById('status-indicator').innerHTML = `
                    <div class="w-2 h-2 rounded-full bg-red-500"></div>
                    <span class="text-xs text-gray-400">Disconnected</span>`;
                setTimeout(connectWS, 3000);
            };
        }

        function handleWSEvent(msg) {
            switch(msg.event) {
                case 'log':
                    addLogEntry(msg.data);
                    if (msg.data.level === 'error') showToast(msg.data.message, 'error');
                    if (msg.data.level === 'cred') showToast(msg.data.message, 'attack', 8000);
                    if (msg.data.level === 'warning') showToast(msg.data.message, 'warning');
                    break;
                case 'devices':
                    devices = msg.data;
                    renderDevices();
                    renderTopology();
                    break;
                case 'attack_start':
                    attacks[msg.data.id] = msg.data;
                    updateAttackUI();
                    showToast(`Attack started: ${msg.data.type} on ${msg.data.target}`, 'attack');
                    break;
                case 'attack_stop':
                    delete attacks[msg.data.id];
                    updateAttackUI();
                    showToast(`Attack stopped: ${msg.data.id}`, 'info');
                    break;
            }
        }

        // ========== API Calls ==========
        async function apiCall(url, options = {}) {
            try {
                const resp = await fetch(url, options);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                return await resp.json();
            } catch(e) {
                showToast(`Request failed: ${e.message}`, 'error');
                return null;
            }
        }

        async function runScan(withPorts) {
            document.getElementById('scan-status').textContent = withPorts ? 'Deep scanning...' : 'Scanning...';
            const data = await apiCall('/api/scan', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ports: withPorts, timeout: 5.0, vulns: withPorts})
            });
            if (data) {
                devices = data.devices;
                renderDevices();
                renderTopology();
                document.getElementById('scan-status').textContent = `${devices.length} devices found`;
                showToast(`Scan complete: ${devices.length} devices`, 'success');
            } else {
                document.getElementById('scan-status').textContent = 'Scan failed';
            }
        }

        async function fullScan() {
            document.getElementById('scan-status').textContent = 'Full recon in progress...';
            showToast('Full recon: ARP + ports + OS detection + vulnerabilities', 'info', 6000);
            const data = await apiCall('/api/scan', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ports: true, timeout: 5.0, os_detect: true, vulns: true})
            });
            if (data) {
                devices = data.devices;
                renderDevices();
                renderTopology();
                renderVulns();
                document.getElementById('scan-status').textContent = `${devices.length} devices — full recon complete`;
                showToast('Full recon complete', 'success');
            }
        }

        async function killDevice(ip) {
            await apiCall('/api/kill', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({target_ip: ip})
            });
        }

        async function nukeNetwork(mode) {
            if (!confirm(`Disconnect ${mode === 'all' ? 'ALL devices' : 'the gateway'}?`)) return;
            await apiCall('/api/nuke', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({mode: mode})
            });
        }

        async function startMITM(ip, opts = {}) {
            await apiCall('/api/mitm', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({target_ip: ip, dns_spoof: opts.dnsSpoof || false, harvest_creds: opts.harvestCreds || false})
            });
        }

        async function stopAttack(attackId) {
            await apiCall(`/api/stop/${attackId}`, {method: 'POST'});
            delete attacks[attackId];
            updateAttackUI();
        }

        async function stopAllAttacks() {
            for (const id of Object.keys(attacks)) await stopAttack(id);
        }

        async function portScan(ip) {
            showToast(`Port scanning ${ip}...`, 'info');
            const data = await apiCall(`/api/portscan?target_ip=${ip}`, {method: 'POST'});
            if (data) {
                const dev = devices.find(d => d.ip === ip);
                if (dev) { dev.open_ports = data.ports; renderDevices(); }
                if (data.vulnerabilities && data.vulnerabilities.length > 0) {
                    vulnerabilities[ip] = data.vulnerabilities;
                    renderVulns();
                    showToast(`Found ${data.vulnerabilities.length} vulnerabilities on ${ip}`, 'warning');
                }
            }
        }

        async function osFingerprint(ip) {
            showToast(`OS fingerprinting ${ip}...`, 'info');
            const data = await apiCall(`/api/os-fingerprint?target_ip=${ip}`, {method: 'POST'});
            if (data) {
                osResults[ip] = data;
                const dev = devices.find(d => d.ip === ip);
                if (dev) { dev.os = data.os_family; renderDevices(); }
                showToast(`OS: ${data.os_family} (${(data.confidence*100).toFixed(0)}%)`, 'success');
            }
        }

        async function toggleMonitor() {
            if (monitoring) {
                await apiCall('/api/monitor/stop', {method: 'POST'});
                monitoring = false;
                document.getElementById('monitor-badge').classList.add('hidden');
                document.getElementById('monitor-btn').textContent = 'Monitor';
            } else {
                await apiCall('/api/monitor/start', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({interval: 30})});
                monitoring = true;
                document.getElementById('monitor-badge').classList.remove('hidden');
                document.getElementById('monitor-btn').textContent = 'Stop Mon.';
                showToast('Network monitoring active', 'success');
            }
        }

        async function exportReport() {
            window.open('/api/report', '_blank');
        }

        async function castAction(ip, action) {
            const data = await apiCall('/api/cast', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({target_ip: ip, action: action})
            });
            if (data && data.data) showModal('Device Info', `<pre class="mono text-xs overflow-auto max-h-96 text-gray-300">${JSON.stringify(data.data, null, 2)}</pre>`);
        }

        async function tvAction(ip, action) {
            await apiCall('/api/tv', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({target_ip: ip, action: action})
            });
        }

        // ========== Rendering ==========
        function renderDevices() {
            const grid = document.getElementById('devices-grid');
            const empty = document.getElementById('empty-state');
            if (devices.length === 0) { empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');

            grid.innerHTML = devices.map(dev => {
                const attackEntry = Object.entries(attacks).find(([id, a]) => a.target === dev.ip);
                const isAttacked = !!attackEntry;
                const attackId = attackEntry ? attackEntry[0] : null;
                const attackType = attackEntry ? attackEntry[1].type : '';
                const borderColor = isAttacked ? 'border-neon-red glow-red' :
                    dev.device_type === 'Google Cast' ? 'border-neon-blue/30' :
                    dev.device_type === 'Samsung Device' ? 'border-neon-purple/30' : 'border-gray-700';

                return `
                    <div class="device-card bg-specter-800 border ${borderColor} rounded-xl p-4 cursor-pointer hover:border-gray-500 transition"
                         onclick="selectDevice('${dev.ip}')">
                        <div class="flex items-start justify-between mb-2">
                            <div class="flex items-center gap-2 min-w-0">
                                ${getDeviceIcon(dev)}
                                <div class="min-w-0">
                                    <div class="text-sm font-semibold text-white truncate">${dev.name || dev.ip}</div>
                                    <div class="text-xs text-gray-400 truncate">${dev.name ? dev.ip + ' — ' : ''}${dev.device_type}${dev.os ? ' (' + dev.os + ')' : ''}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                ${isAttacked ? `
                                    <span class="px-1.5 py-0.5 text-[10px] font-bold uppercase bg-red-900/50 text-neon-red border border-red-800 rounded">${attackType}</span>
                                    <button onclick="event.stopPropagation(); stopAttack('${attackId}')" class="ml-1 w-5 h-5 flex items-center justify-center bg-gray-700 rounded hover:bg-gray-600 text-gray-300 text-xs" title="Stop">x</button>
                                ` : ''}
                                ${dev.vuln_count > 0 ? `<span class="px-1.5 py-0.5 text-[10px] font-bold bg-orange-900/50 text-neon-orange border border-orange-800 rounded">${dev.vuln_count} vuln</span>` : ''}
                            </div>
                        </div>
                        <div class="space-y-1 text-xs">
                            <div class="flex justify-between"><span class="text-gray-500">MAC</span><span class="mono text-gray-300">${dev.mac}</span></div>
                            <div class="flex justify-between"><span class="text-gray-500">Vendor</span><span class="text-gray-300 truncate ml-2">${dev.vendor}</span></div>
                            ${dev.services.length > 0 ? `<div class="flex justify-between"><span class="text-gray-500">Services</span><span class="text-neon-blue truncate ml-2">${dev.services.slice(0,3).join(', ')}${dev.services.length > 3 ? '...' : ''}</span></div>` : ''}
                            ${dev.open_ports && dev.open_ports.length > 0 ? `<div class="mt-1 pt-1 border-t border-gray-700"><span class="text-gray-500">Ports:</span> <span class="text-neon-green mono">${dev.open_ports.map(p => p.port).join(', ')}</span></div>` : ''}
                        </div>
                        <div class="mt-2 pt-2 border-t border-gray-700 flex gap-1.5 flex-wrap">
                            <button onclick="event.stopPropagation(); killDevice('${dev.ip}')" class="px-2 py-1 text-[10px] bg-red-900/30 text-neon-red border border-red-800 rounded hover:bg-red-900/60">Kill</button>
                            <button onclick="event.stopPropagation(); startMITM('${dev.ip}', {harvestCreds: true})" class="px-2 py-1 text-[10px] bg-yellow-900/30 text-neon-yellow border border-yellow-800 rounded hover:bg-yellow-900/60">MITM</button>
                            <button onclick="event.stopPropagation(); portScan('${dev.ip}')" class="px-2 py-1 text-[10px] bg-blue-900/30 text-neon-blue border border-blue-800 rounded hover:bg-blue-900/60">Ports</button>
                            <button onclick="event.stopPropagation(); osFingerprint('${dev.ip}')" class="px-2 py-1 text-[10px] bg-green-900/30 text-green-400 border border-green-800 rounded hover:bg-green-900/60">OS</button>
                            ${dev.device_type === 'Google Cast' ? `<button onclick="event.stopPropagation(); castAction('${dev.ip}', 'info')" class="px-2 py-1 text-[10px] bg-cyan-900/30 text-cyan-400 border border-cyan-800 rounded hover:bg-cyan-900/60">Cast</button>` : ''}
                            ${dev.device_type === 'Samsung Device' ? `<button onclick="event.stopPropagation(); tvAction('${dev.ip}', 'off')" class="px-2 py-1 text-[10px] bg-purple-900/30 text-neon-purple border border-purple-800 rounded hover:bg-purple-900/60">TV Off</button>` : ''}
                        </div>
                    </div>`;
            }).join('');
        }

        function getDeviceIcon(dev) {
            const icons = {
                'Google Cast': {bg: 'bg-blue-900/50', color: 'text-neon-blue'},
                'Samsung Device': {bg: 'bg-purple-900/50', color: 'text-neon-purple'},
                'Printer': {bg: 'bg-yellow-900/50', color: 'text-neon-yellow'},
                'Router': {bg: 'bg-green-900/50', color: 'text-neon-green'},
            };
            const style = icons[dev.device_type] || {bg: 'bg-gray-700', color: 'text-gray-400'};
            return `<div class="w-8 h-8 ${style.bg} rounded-lg flex items-center justify-center shrink-0"><svg class="w-4 h-4 ${style.color}" fill="currentColor" viewBox="0 0 20 20"><circle cx="10" cy="10" r="5"/></svg></div>`;
        }

        // ========== Topology Graph ==========
        function renderTopology() {
            const svg = document.getElementById('topology-svg');
            if (!svg || devices.length === 0) return;
            const rect = svg.getBoundingClientRect();
            const w = rect.width || 800, h = rect.height || 500;
            const cx = w / 2, cy = h / 2;
            const radius = Math.min(w, h) * 0.35;

            // Gateway in center
            let html = `<circle cx="${cx}" cy="${cy}" r="20" fill="#1a1a2e" stroke="#00ff88" stroke-width="2" class="topo-node"/>`;
            html += `<text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="#00ff88" font-size="10" font-family="monospace">GW</text>`;

            devices.forEach((dev, i) => {
                const angle = (2 * Math.PI * i) / devices.length - Math.PI / 2;
                const x = cx + radius * Math.cos(angle);
                const y = cy + radius * Math.sin(angle);
                const isAttacked = Object.values(attacks).some(a => a.target === dev.ip);
                const lineClass = isAttacked ? 'topo-line-active' : 'topo-line';
                const nodeColor = isAttacked ? '#ff3b3b' : dev.device_type === 'Google Cast' ? '#00bfff' : dev.device_type === 'Samsung Device' ? '#b44dff' : '#666';

                html += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="${lineClass}"/>`;
                html += `<circle cx="${x}" cy="${y}" r="12" fill="#12121a" stroke="${nodeColor}" stroke-width="2" class="topo-node" onclick="selectDevice('${dev.ip}')"/>`;
                html += `<text x="${x}" y="${y + 20}" text-anchor="middle" fill="#999" font-size="9" font-family="monospace">${dev.name || dev.ip.split('.')[3]}</text>`;
            });

            svg.innerHTML = html;
        }

        // ========== Vulnerabilities View ==========
        function renderVulns() {
            // Fetch latest
            fetch('/api/vulnerabilities').then(r => r.json()).then(data => {
                vulnerabilities = data.vulnerabilities || {};
                const container = document.getElementById('vulns-content');
                const allVulns = Object.entries(vulnerabilities).flatMap(([ip, vulns]) => vulns.map(v => ({...v, ip})));

                if (allVulns.length === 0) {
                    container.innerHTML = '<p class="text-gray-500">No vulnerabilities detected. Run a Deep Scan or Full Recon.</p>';
                    return;
                }

                const sevColors = {critical: 'text-neon-red bg-red-900/30 border-red-800', high: 'text-neon-orange bg-orange-900/30 border-orange-800', medium: 'text-neon-yellow bg-yellow-900/30 border-yellow-800', low: 'text-neon-blue bg-blue-900/30 border-blue-800', info: 'text-gray-400 bg-gray-800 border-gray-700'};
                container.innerHTML = allVulns.map(v => `
                    <div class="bg-specter-800 border border-gray-700 rounded-lg p-3">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="px-2 py-0.5 text-[10px] font-bold uppercase border rounded ${sevColors[v.severity] || sevColors.info}">${v.severity}</span>
                            <span class="text-sm font-medium text-white">${v.title}</span>
                            <span class="ml-auto text-xs text-gray-500 mono">${v.ip}:${v.port}</span>
                        </div>
                        <p class="text-xs text-gray-400 mt-1">${v.description}</p>
                        ${v.cve ? `<p class="text-xs text-neon-orange mt-1">${v.cve}</p>` : ''}
                        <p class="text-xs text-neon-green mt-1">${v.remediation}</p>
                    </div>
                `).join('');
            });
        }

        // ========== Device Details ==========
        function selectDevice(ip) {
            selectedDevice = devices.find(d => d.ip === ip);
            showDeviceDetails(selectedDevice);
            switchTab('details');
        }

        function showDeviceDetails(dev) {
            const panel = document.getElementById('device-details');
            const attackEntry = Object.entries(attacks).find(([id, a]) => a.target === dev.ip);
            const attackId = attackEntry ? attackEntry[0] : null;
            const os = osResults[dev.ip];
            const vulns = vulnerabilities[dev.ip] || [];

            panel.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-bold text-white">${dev.name || dev.ip}</h3>
                        ${attackId ? `<button onclick="stopAttack('${attackId}')" class="px-3 py-1 text-xs bg-gray-700 text-white rounded hover:bg-gray-600">Stop</button>` : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-specter-700 rounded-lg p-3"><div class="text-gray-500 mb-1">Type</div><div class="text-white font-medium">${dev.device_type}</div></div>
                        <div class="bg-specter-700 rounded-lg p-3"><div class="text-gray-500 mb-1">Vendor</div><div class="text-white font-medium">${dev.vendor}</div></div>
                        <div class="bg-specter-700 rounded-lg p-3"><div class="text-gray-500 mb-1">MAC</div><div class="text-white font-medium mono">${dev.mac}</div></div>
                        <div class="bg-specter-700 rounded-lg p-3"><div class="text-gray-500 mb-1">OS</div><div class="text-white font-medium">${os ? `${os.os_family} (${(os.confidence*100).toFixed(0)}%)` : dev.os || 'Unknown'}</div></div>
                    </div>
                    ${os && os.evidence ? `<div class="bg-specter-700 rounded-lg p-3"><div class="text-gray-500 text-xs mb-1">OS Evidence</div><div class="text-xs text-gray-300 mono">${os.evidence.join('<br>')}</div></div>` : ''}
                    ${dev.open_ports && dev.open_ports.length > 0 ? `
                    <div><h4 class="text-sm font-semibold text-gray-300 mb-2">Open Ports</h4><div class="space-y-1">${dev.open_ports.map(p => `
                        <div class="flex items-center justify-between bg-specter-700 rounded px-3 py-2 text-xs">
                            <span class="mono text-neon-green">${p.port}</span><span class="text-gray-400">${p.service}</span>${p.unauth ? '<span class="text-neon-red font-bold">UNAUTH</span>' : ''}
                        </div>`).join('')}</div></div>` : ''}
                    ${vulns.length > 0 ? `
                    <div><h4 class="text-sm font-semibold text-neon-red mb-2">Vulnerabilities (${vulns.length})</h4><div class="space-y-1 text-xs">${vulns.slice(0,5).map(v => `
                        <div class="bg-specter-700 rounded px-3 py-2"><span class="font-bold text-neon-orange">[${v.severity}]</span> ${v.title}</div>`).join('')}</div></div>` : ''}
                    <div><h4 class="text-sm font-semibold text-gray-300 mb-2">Actions</h4>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="killDevice('${dev.ip}')" class="px-3 py-2 text-xs bg-red-900/30 text-neon-red border border-red-800 rounded-lg hover:bg-red-900/60">Kill</button>
                            <button onclick="startMITM('${dev.ip}', {harvestCreds:true, dnsSpoof:true})" class="px-3 py-2 text-xs bg-yellow-900/30 text-neon-yellow border border-yellow-800 rounded-lg hover:bg-yellow-900/60">Full MITM</button>
                            <button onclick="portScan('${dev.ip}')" class="px-3 py-2 text-xs bg-blue-900/30 text-neon-blue border border-blue-800 rounded-lg hover:bg-blue-900/60">Port Scan</button>
                            <button onclick="osFingerprint('${dev.ip}')" class="px-3 py-2 text-xs bg-green-900/30 text-green-400 border border-green-800 rounded-lg hover:bg-green-900/60">OS Detect</button>
                            ${dev.device_type === 'Google Cast' ? `<button onclick="castAction('${dev.ip}', 'info')" class="px-3 py-2 text-xs bg-cyan-900/30 text-cyan-400 border border-cyan-800 rounded-lg hover:bg-cyan-900/60">Cast Info</button>` : ''}
                            ${dev.device_type === 'Samsung Device' ? `<button onclick="tvAction('${dev.ip}', 'off')" class="px-3 py-2 text-xs bg-purple-900/30 text-neon-purple border border-purple-800 rounded-lg hover:bg-purple-900/60">TV Off</button>` : ''}
                        </div>
                    </div>
                </div>`;
        }

        // ========== Logs ==========
        function addLogEntry(entry) {
            const container = document.getElementById('log-entries');
            const colors = {info:'text-gray-400', success:'text-neon-green', attack:'text-neon-red', mitm:'text-neon-yellow', cred:'text-neon-red font-bold', error:'text-red-400', warning:'text-neon-orange'};
            const el = document.createElement('div');
            el.className = `log-entry ${colors[entry.level] || 'text-gray-400'}`;
            el.innerHTML = `<span class="text-gray-600">[${entry.time}]</span> <span class="text-gray-500">[${entry.level}]</span> ${entry.message}`;
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
            while (container.children.length > 300) container.removeChild(container.firstChild);
        }

        // ========== UI Helpers ==========
        function switchTab(tab) {
            document.getElementById('panel-logs').classList.toggle('hidden', tab !== 'logs');
            document.getElementById('panel-details').classList.toggle('hidden', tab !== 'details');
            document.getElementById('tab-logs').className = `flex-1 px-4 py-3 text-sm font-medium ${tab === 'logs' ? 'text-neon-green border-b-2 border-neon-green' : 'text-gray-500 border-b-2 border-transparent hover:text-gray-300'}`;
            document.getElementById('tab-details').className = `flex-1 px-4 py-3 text-sm font-medium ${tab === 'details' ? 'text-neon-green border-b-2 border-neon-green' : 'text-gray-500 border-b-2 border-transparent hover:text-gray-300'}`;
        }

        function switchView(view) {
            ['grid', 'topology', 'vulns'].forEach(v => {
                document.getElementById(`view-${v}-panel`).classList.toggle('hidden', v !== view);
                document.getElementById(`view-${v}`).className = `px-3 py-2 text-xs font-medium ${v === view ? 'text-neon-blue border-b-2 border-neon-blue' : 'text-gray-500 border-b-2 border-transparent hover:text-gray-300'}`;
            });
            if (view === 'topology') renderTopology();
            if (view === 'vulns') renderVulns();
        }

        function updateAttackUI() {
            const count = Object.keys(attacks).length;
            document.getElementById('attack-count').textContent = count;
            document.getElementById('attack-counter').classList.toggle('hidden', count === 0);
            document.getElementById('stop-all-btn').classList.toggle('hidden', count === 0);
            renderDevices();
            renderTopology();
        }

        function showModal(title, content) {
            document.getElementById('modal-content').innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-white">${title}</h3>
                    <button onclick="document.getElementById('modal').classList.add('hidden');document.getElementById('modal').classList.remove('flex')" class="text-gray-400 hover:text-white text-xl">&times;</button>
                </div>${content}`;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function closeModal(event) {
            if (event.target === document.getElementById('modal')) {
                document.getElementById('modal').classList.add('hidden');
                document.getElementById('modal').classList.remove('flex');
            }
        }

        // ========== Init ==========
        connectWS();
        fetch('/api/attacks').then(r => r.json()).then(data => {
            data.attacks.forEach(a => { attacks[a.id] = a; });
            updateAttackUI();
        });
        fetch('/api/devices').then(r => r.json()).then(data => {
            if (data.devices.length > 0) { devices = data.devices; renderDevices(); renderTopology(); }
        });
        fetch('/api/monitor/status').then(r => r.json()).then(data => {
            if (data.running) { monitoring = true; document.getElementById('monitor-badge').classList.remove('hidden'); document.getElementById('monitor-btn').textContent = 'Stop Mon.'; }
        });
        // Resize topology on window resize
        window.addEventListener('resize', () => renderTopology());
    </script>
</body>
</html>
