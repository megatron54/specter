[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specter"
version = "0.1.0"
description = "Network IoT reconnaissance and control framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "megatron54"}
]
dependencies = [
    "scapy>=2.5.0",
    "zeroconf>=0.151.3",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
specter = "specter.cli:app"

[tool.setuptools.packages.find]
include = ["specter*"]
